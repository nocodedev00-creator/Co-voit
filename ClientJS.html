<script>
  /**
   * Logique Client SPA Co'Voit' (Détail Aller + Retour à la suite, conducteur affecté, places indépendantes).
   */

  const AppState = {
    route: window.SERVER_ROUTING ? window.SERVER_ROUTING.route : 'NO_ACCESS',
    matchId: window.SERVER_ROUTING ? window.SERVER_ROUTING.matchId : null,
    adminToken: window.SERVER_ROUTING ? window.SERVER_ROUTING.adminToken : null,
    webAppUrl: window.SERVER_ROUTING ? window.SERVER_ROUTING.webAppUrl : '',
    authUser: window.SERVER_ROUTING ? window.SERVER_ROUTING.authUser : null,
    currentUser: localStorage.getItem('covoid_username') || '',
    currentMatchData: null,
    adminMatches: []
  };

  /**
   * Construit une URL de la Web App en propageant le paramètre authuser
   * (index du compte Google) pour éviter l'écran de sélection de compte
   * dans les navigateurs multi-comptes.
   * @param {Object} extraParams - Paramètres additionnels (ex: { m: 'matchId' }).
   * @returns {string} URL complète.
   */
  function buildAppUrl(extraParams = {}) {
    const base = AppState.webAppUrl || '';
    if (!base) return '';

    const params = new URLSearchParams();
    Object.keys(extraParams).forEach(key => {
      const val = extraParams[key];
      if (val !== undefined && val !== null && val !== '') {
        params.set(key, val);
      }
    });

    // Propager authuser si connu (force le bon compte Google)
    if (AppState.authUser !== undefined && AppState.authUser !== null && AppState.authUser !== '') {
      params.set('authuser', AppState.authUser);
    }

    const query = params.toString();
    return query ? `${base}?${query}` : base;
  }

  function safeLower(val) {
    if (val === undefined || val === null) return '';
    return String(val).trim().toLowerCase();
  }

  function formatShortDate(dateStr) {
    if (!dateStr) return '--/--/--';
    const clean = String(dateStr).split('T')[0].split('-');
    if (clean.length === 3) {
      const yearShort = clean[0].slice(-2);
      return `${clean[2]}/${clean[1]}/${yearShort}`;
    }
    return dateStr;
  }

  function formatShortTime(timeStr) {
    if (!timeStr) return '--:--';
    const parts = String(timeStr).split(':');
    if (parts.length >= 2) {
      return `${parts[0].padStart(2, '0')}:${parts[1].padStart(2, '0')}`;
    }
    return timeStr;
  }

  function callServer(methodName, ...args) {
    return new Promise((resolve, reject) => {
      if (!google || !google.script || !google.script.run) {
        reject(new Error("L'environnement Google Apps Script n'est pas prêt."));
        return;
      }

      google.script.run
        .withSuccessHandler(response => {
          if (response && response.success === false) {
            reject(new Error(response.error || 'Erreur serveur non spécifiée.'));
          } else {
            resolve(response ? response.data : null);
          }
        })
        .withFailureHandler(error => {
          reject(new Error(error.message || 'Échec de communication réseau avec Google Apps Script.'));
        })[methodName](...args);
    });
  }

  function showToast(message, type = 'info') {
    const container = document.getElementById('toast-container');
    if (!container) return;

    const toast = document.createElement('div');
    const colorClasses = {
      info: 'bg-slate-900 text-white border border-slate-700',
      success: 'bg-emerald-600 text-white shadow-emerald-200',
      error: 'bg-rose-600 text-white shadow-rose-200'
    }[type] || 'bg-slate-900 text-white';

    toast.className = `${colorClasses} toast-enter px-4 py-3 rounded-xl shadow-lg text-xs font-bold flex items-center justify-between gap-3 pointer-events-auto max-w-xs`;
    toast.innerHTML = `
      <span>${escapeHtml(message)}</span>
      <button class="opacity-75 hover:opacity-100">&times;</button>
    `;

    toast.querySelector('button').onclick = () => toast.remove();
    container.appendChild(toast);

    setTimeout(() => {
      if (toast.parentElement) toast.remove();
    }, 4000);
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function openModal(modalId) {
    const modal = document.getElementById(modalId);
    if (modal) modal.classList.remove('hidden');
  }

  function closeModal(modalId) {
    const modal = document.getElementById(modalId);
    if (modal) modal.classList.add('hidden');
  }

  function setUsername(name) {
    AppState.currentUser = String(name || '').trim();
    localStorage.setItem('covoid_username', AppState.currentUser);
    updateUserDisplay();
  }

  function updateUserDisplay() {
    const display = document.getElementById('display-current-user');
    if (display) {
      display.textContent = AppState.currentUser || 'Visiteur';
    }
  }

  function checkUserIdentityFlow() {
    if (AppState.route !== 'MATCH') return;

    const knownBlock = document.getElementById('identity-known-block');
    const unknownBlock = document.getElementById('identity-unknown-block');
    const knownName = document.getElementById('identity-known-name');

    if (AppState.currentUser) {
      knownName.textContent = AppState.currentUser;
      knownBlock.classList.remove('hidden');
      unknownBlock.classList.add('hidden');
    } else {
      knownBlock.classList.add('hidden');
      unknownBlock.classList.remove('hidden');
    }

    openModal('modal-identity');
  }

  async function loadMatchDetails() {
    if (!AppState.matchId) return;

    try {
      const data = await callServer('ctrlGetMatchDetails', AppState.matchId);
      if (!data) return;
      AppState.currentMatchData = data;
      renderMatchView(data);
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  function renderMatchView(data) {
    if (!data || !data.match) return;

    const match = data.match;
    const rides = Array.isArray(data.rides) ? data.rides : [];
    const waiting = Array.isArray(data.waiting_list) ? data.waiting_list : [];

    document.getElementById('match-title-display').textContent = match.title;
    document.getElementById('match-date-display').textContent = formatShortDate(match.event_date);
    document.getElementById('match-time-display').textContent = formatShortTime(match.departure_time);
    document.getElementById('match-place-display').textContent = match.meeting_place;

    const statusBadge = document.getElementById('match-status-badge');
    const bannerLocked = document.getElementById('banner-locked');
    const actionsContainer = document.getElementById('match-actions-container');

    if (match.is_locked) {
      statusBadge.className = 'inline-flex items-center px-2.5 py-0.5 rounded-md text-[10px] font-black bg-rose-100 text-rose-900 border border-rose-300 shrink-0';
      statusBadge.textContent = 'Verrouillé';
      bannerLocked.classList.remove('hidden');
      actionsContainer.classList.add('opacity-50', 'pointer-events-none');
    } else {
      statusBadge.className = 'inline-flex items-center px-2.5 py-0.5 rounded-md text-[10px] font-black bg-emerald-100 text-emerald-900 border border-emerald-300 shrink-0';
      statusBadge.textContent = 'Ouvert';
      bannerLocked.classList.add('hidden');
      actionsContainer.classList.remove('opacity-50', 'pointer-events-none');
    }

    calculateAndRenderSummary(rides, waiting);
    renderUserCurrentStatus(rides, waiting, match.is_locked);

    const ridesContainer = document.getElementById('rides-list-container');
    document.getElementById('rides-count-badge').textContent = rides.length;
    ridesContainer.innerHTML = '';

    if (rides.length === 0) {
      ridesContainer.innerHTML = `
        <div class="p-6 text-center bg-white rounded-2xl border-2 border-dashed border-slate-300 text-slate-500 font-bold text-xs">
          Aucun véhicule proposé pour le moment. Soyez le premier !
        </div>`;
    } else {
      rides.forEach(ride => {
        ridesContainer.appendChild(createRideCardElement(ride, match.is_locked));
      });
    }

    const waitingContainer = document.getElementById('waiting-list-container');
    document.getElementById('waiting-count-badge').textContent = waiting.length;
    waitingContainer.innerHTML = '';

    if (waiting.length === 0) {
      waitingContainer.innerHTML = `<span class="text-xs text-amber-900/70 font-bold italic">Personne en attente de véhicule</span>`;
    } else {
      waiting.forEach(item => {
        const chip = document.createElement('div');
        const pNameSafe = safeLower(item.player_name);
        const myNameSafe = safeLower(AppState.currentUser);
        const isMe = myNameSafe && pNameSafe === myNameSafe;
        
        chip.className = `flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-black shadow-sm ${isMe ? 'bg-amber-400 text-amber-950 border-2 border-amber-600' : 'bg-white text-amber-950 border border-amber-300'}`;

        let needTag = '';
        if (item.needs_outward && item.needs_return) needTag = 'Aller-Ret';
        else if (item.needs_outward) needTag = 'Aller';
        else if (item.needs_return) needTag = 'Retour';

        chip.innerHTML = `
          <span>${escapeHtml(item.player_name)} (${needTag})</span>
          ${isMe || AppState.adminToken ? `<button class="btn-remove-waiting text-amber-800 hover:text-rose-600 font-black ml-1 text-sm leading-none" data-id="${item.id}">&times;</button>` : ''}
        `;

        const removeBtn = chip.querySelector('.btn-remove-waiting');
        if (removeBtn) {
          removeBtn.onclick = () => handleLeaveWaitingList(item.id);
        }

        waitingContainer.appendChild(chip);
      });
    }
  }

  function calculateAndRenderSummary(rides, waiting) {
    const uniqueParticipants = new Set();
    let directCount = 0;

    let outwardSeats = 0;
    let returnSeats = 0;

    let outwardDemands = 0;
    let returnDemands = 0;

    rides.forEach(r => {
      const dName = safeLower(r.driver_name);
      if (dName) uniqueParticipants.add(dName);

      if (r.is_direct) {
        directCount++;
      } else {
        if (r.offers_outward) outwardSeats += Number(r.seats_outward !== undefined ? r.seats_outward : (r.seats_total || 0));
        if (r.offers_return) returnSeats += Number(r.seats_return !== undefined ? r.seats_return : (r.seats_total || 0));
      }

      (r.outward_passengers || []).forEach(p => {
        const pLower = safeLower(p);
        if (pLower) uniqueParticipants.add(pLower);
        outwardDemands++;
      });

      (r.return_passengers || []).forEach(p => {
        const pLower = safeLower(p);
        if (pLower) uniqueParticipants.add(pLower);
        returnDemands++;
      });
    });

    waiting.forEach(w => {
      if (w && w.player_name) {
        const wLower = safeLower(w.player_name);
        if (wLower) uniqueParticipants.add(wLower);
      }
      if (w.needs_outward) outwardDemands++;
      if (w.needs_return) returnDemands++;
    });

    document.getElementById('stat-total-respondents').textContent = `${uniqueParticipants.size} joueur(s)`;
    document.getElementById('stat-direct-count').textContent = `${directCount} joueur(s)`;

    document.getElementById('stat-outward-seats').textContent = outwardSeats;
    document.getElementById('stat-outward-demands').textContent = outwardDemands;
    document.getElementById('stat-return-seats').textContent = returnSeats;
    document.getElementById('stat-return-demands').textContent = returnDemands;

    const soldeOutward = outwardSeats - outwardDemands;
    const soldeReturn = returnSeats - returnDemands;

    const badgeOutward = document.getElementById('badge-bilan-outward');
    if (soldeOutward >= 0) {
      badgeOutward.className = 'text-[10px] font-black px-2 py-0.5 rounded bg-emerald-100 text-emerald-900 border border-emerald-300 whitespace-nowrap shrink-0';
      badgeOutward.textContent = soldeOutward === 0 ? 'Complet (0)' : `+${soldeOutward} libre`;
    } else {
      badgeOutward.className = 'text-[10px] font-black px-2 py-0.5 rounded bg-rose-100 text-rose-900 border border-rose-300 whitespace-nowrap shrink-0';
      badgeOutward.textContent = `Manque ${Math.abs(soldeOutward)}`;
    }

    const badgeReturn = document.getElementById('badge-bilan-return');
    if (soldeReturn >= 0) {
      badgeReturn.className = 'text-[10px] font-black px-2 py-0.5 rounded bg-emerald-100 text-emerald-900 border border-emerald-300 whitespace-nowrap shrink-0';
      badgeReturn.textContent = soldeReturn === 0 ? 'Complet (0)' : `+${soldeReturn} libre`;
    } else {
      badgeReturn.className = 'text-[10px] font-black px-2 py-0.5 rounded bg-rose-100 text-rose-900 border border-rose-300 whitespace-nowrap shrink-0';
      badgeReturn.textContent = `Manque ${Math.abs(soldeReturn)}`;
    }

    const globalIndicator = document.getElementById('global-status-indicator');
    if (soldeOutward >= 0 && soldeReturn >= 0) {
      globalIndicator.className = 'text-xs font-black px-3 py-1 rounded-full bg-emerald-100 text-emerald-900 border border-emerald-300 flex items-center gap-1.5';
      globalIndicator.innerHTML = `<span>🟢</span> <span>Places suffisantes</span>`;
    } else {
      const missingTotal = (soldeOutward < 0 ? Math.abs(soldeOutward) : 0) + (soldeReturn < 0 ? Math.abs(soldeReturn) : 0);
      globalIndicator.className = 'text-xs font-black px-3 py-1 rounded-full bg-rose-100 text-rose-900 border border-rose-300 flex items-center gap-1.5';
      globalIndicator.innerHTML = `<span>🔴</span> <span>Manque ${missingTotal} place(s)</span>`;
    }
  }

  // OUVRIR LA MODALE DES DÉTAILS : ALLER PUIS RETOUR À LA SUITE
  function openSummaryDetailsModal() {
    if (!AppState.currentMatchData) return;

    const rides = AppState.currentMatchData.rides || [];
    const waiting = AppState.currentMatchData.waiting_list || [];

    // --- 1. DÉTAILS ALLER ---
    const rdvOutwardList = [];
    const directOutwardList = [];

    rides.forEach(r => {
      const driver = r.driver_name;
      const isDirect = Boolean(r.is_direct);
      const seatsOut = r.seats_outward !== undefined ? Number(r.seats_outward) : Number(r.seats_total || 0);

      if (r.offers_outward) {
        if (isDirect) {
          directOutwardList.push(`🚗 ${driver} ${seatsOut > 0 ? `(Voiture directe • ${seatsOut} pl.)` : '(Direct par ses moyens)'}`);
          (r.outward_passengers || []).forEach(p => directOutwardList.push(`👤 ${p} (avec ${driver})`));
        } else {
          rdvOutwardList.push(`🚗 ${driver} (Conducteur • ${seatsOut} pl.)`);
          (r.outward_passengers || []).forEach(p => rdvOutwardList.push(`👤 ${p} (avec ${driver})`));
        }
      }
    });

    waiting.forEach(w => {
      if (w && w.needs_outward) {
        rdvOutwardList.push(`⚠️ ${w.player_name} (Sans place Aller)`);
      }
    });

    // --- 2. DÉTAILS RETOUR ---
    const rdvReturnList = [];
    const directReturnList = [];

    rides.forEach(r => {
      const driver = r.driver_name;
      const isDirect = Boolean(r.is_direct);
      const seatsRet = r.seats_return !== undefined ? Number(r.seats_return) : Number(r.seats_total || 0);

      if (r.offers_return) {
        if (isDirect) {
          directReturnList.push(`🚗 ${driver} ${seatsRet > 0 ? `(Voiture directe • ${seatsRet} pl.)` : '(Direct par ses moyens)'}`);
          (r.return_passengers || []).forEach(p => directReturnList.push(`👤 ${p} (avec ${driver})`));
        } else {
          rdvReturnList.push(`🚗 ${driver} (Conducteur • ${seatsRet} pl.)`);
          (r.return_passengers || []).forEach(p => rdvReturnList.push(`👤 ${p} (avec ${driver})`));
        }
      }
    });

    waiting.forEach(w => {
      if (w && w.needs_return) {
        rdvReturnList.push(`⚠️ ${w.player_name} (Sans place Retour)`);
      }
    });

    // --- INJECTION ALLER ---
    document.getElementById('detail-count-rdv-outward').textContent = rdvOutwardList.length;
    document.getElementById('detail-count-direct-outward').textContent = directOutwardList.length;
    document.getElementById('detail-total-outward').textContent = `${rdvOutwardList.length + directOutwardList.length} joueur(s)`;

    renderChipsList('detail-list-rdv-outward', rdvOutwardList, 'bg-white text-blue-950 border-blue-200', 'Aucun joueur au RDV Aller');
    renderChipsList('detail-list-direct-outward', directOutwardList, 'bg-white text-slate-800 border-slate-300', 'Aucun joueur en direct Aller');

    // --- INJECTION RETOUR ---
    document.getElementById('detail-count-rdv-return').textContent = rdvReturnList.length;
    document.getElementById('detail-count-direct-return').textContent = directReturnList.length;
    document.getElementById('detail-total-return').textContent = `${rdvReturnList.length + directReturnList.length} joueur(s)`;

    renderChipsList('detail-list-rdv-return', rdvReturnList, 'bg-white text-indigo-950 border-indigo-200', 'Aucun joueur au RDV Retour');
    renderChipsList('detail-list-direct-return', directReturnList, 'bg-white text-slate-800 border-slate-300', 'Aucun joueur en direct Retour');

    openModal('modal-summary-details');
  }

  function renderChipsList(containerId, list, chipClasses, emptyText) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.innerHTML = '';

    if (list.length === 0) {
      container.innerHTML = `<span class="text-[11px] text-slate-400 italic">${emptyText}</span>`;
      return;
    }

    list.forEach(item => {
      const span = document.createElement('span');
      span.className = `px-2.5 py-1 font-bold text-xs rounded-lg border shadow-sm ${chipClasses}`;
      span.textContent = item;
      container.appendChild(span);
    });
  }

  function renderUserCurrentStatus(rides, waiting, isLocked) {
    const statusCard = document.getElementById('user-status-card');
    const descEl = document.getElementById('user-status-description');
    const actionsEl = document.getElementById('user-status-actions');

    if (!AppState.currentUser) {
      statusCard.classList.add('hidden');
      return;
    }

    const myName = safeLower(AppState.currentUser);
    actionsEl.innerHTML = '';

    // Cas 1 : Conducteur
    const myRide = rides.find(r => safeLower(r.driver_name) === myName);
    if (myRide) {
      statusCard.classList.remove('hidden');
      if (myRide.is_direct && myRide.seats_total === 0) {
        descEl.innerHTML = `Tu vas <strong>directement sur place par tes propres moyens</strong>.`;
      } else {
        const out = myRide.seats_outward !== undefined ? myRide.seats_outward : myRide.seats_total;
        const ret = myRide.seats_return !== undefined ? myRide.seats_return : myRide.seats_total;
        descEl.innerHTML = `Tu proposes ta voiture (<strong>${out} pl. Aller</strong> / <strong>${ret} pl. Retour</strong>)${myRide.is_direct ? ' • Direct 📍' : ''}.`;
      }

      if (!isLocked) {
        const editBtn = document.createElement('button');
        editBtn.className = 'btn-tap py-2 px-3 bg-blue-600 text-white hover:bg-blue-700 font-black rounded-xl text-xs flex items-center gap-1 shadow-sm';
        editBtn.innerHTML = `<span>✏️</span> <span>Modifier mes places</span>`;
        editBtn.onclick = () => openEditRideModal(myRide);
        actionsEl.appendChild(editBtn);

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'btn-tap py-2 px-3 bg-rose-100 text-rose-800 hover:bg-rose-200 font-bold rounded-xl text-xs flex items-center gap-1 border border-rose-300';
        deleteBtn.innerHTML = `<span>🗑️</span> <span>Annuler</span>`;
        deleteBtn.onclick = () => handleDeleteVehicle(myRide.id);
        actionsEl.appendChild(deleteBtn);
      }
      return;
    }

    // Cas 2 : Passager
    const passengerRides = [];
    rides.forEach(r => {
      const inOut = (r.outward_passengers || []).map(p => safeLower(p)).includes(myName);
      const inRet = (r.return_passengers || []).map(p => safeLower(p)).includes(myName);
      if (inOut || inRet) {
        passengerRides.push({ ride: r, inOut, inRet });
      }
    });

    if (passengerRides.length > 0) {
      statusCard.classList.remove('hidden');
      let text = 'Inscrit comme passager :<br>';
      passengerRides.forEach(pr => {
        const segments = [];
        if (pr.inOut) segments.push('Aller');
        if (pr.inRet) segments.push('Retour');
        text += `• Voiture de <strong>${escapeHtml(pr.ride.driver_name)}</strong> (${segments.join(', ')})<br>`;
      });
      descEl.innerHTML = text;

      if (!isLocked) {
        passengerRides.forEach(pr => {
          if (pr.inOut) {
            const btn = document.createElement('button');
            btn.className = 'btn-tap py-1.5 px-3 bg-rose-100 text-rose-800 hover:bg-rose-200 font-bold rounded-lg text-xs border border-rose-300';
            btn.textContent = `Quitter l'Aller (${pr.ride.driver_name})`;
            btn.onclick = () => handleLeaveRide(pr.ride.id, AppState.currentUser, 'outward');
            actionsEl.appendChild(btn);
          }
          if (pr.inRet) {
            const btn = document.createElement('button');
            btn.className = 'btn-tap py-1.5 px-3 bg-rose-100 text-rose-800 hover:bg-rose-200 font-bold rounded-lg text-xs border border-rose-300';
            btn.textContent = `Quitter le Retour (${pr.ride.driver_name})`;
            btn.onclick = () => handleLeaveRide(pr.ride.id, AppState.currentUser, 'return');
            actionsEl.appendChild(btn);
          }
        });
      }
      return;
    }

    // Cas 3 : En liste d'attente
    const myWait = waiting.find(w => safeLower(w.player_name) === myName);
    if (myWait) {
      statusCard.classList.remove('hidden');
      let needText = '';
      if (myWait.needs_outward && myWait.needs_return) needText = 'Aller et Retour';
      else if (myWait.needs_outward) needText = 'Aller uniquement';
      else needText = 'Retour uniquement';

      descEl.innerHTML = `Tu es <strong>en recherche d'une place</strong> (${needText}).`;

      if (!isLocked) {
        const cancelBtn = document.createElement('button');
        cancelBtn.className = 'btn-tap py-2 px-3 bg-amber-200 text-amber-950 hover:bg-amber-300 font-bold rounded-xl text-xs border border-amber-400';
        cancelBtn.textContent = "Me retirer de la liste";
        cancelBtn.onclick = () => handleLeaveWaitingList(myWait.id);
        actionsEl.appendChild(cancelBtn);
      }
      return;
    }

    statusCard.classList.add('hidden');
  }

  function openEditRideModal(ride) {
    document.getElementById('modal-car-title').textContent = 'Modifier mon véhicule';
    document.getElementById('input-edit-ride-id').value = ride.id;
    document.getElementById('input-car-driver').value = ride.driver_name;
    document.getElementById('input-car-driver').disabled = true;

    document.getElementById('check-offers-outward').checked = Boolean(ride.offers_outward);
    document.getElementById('check-offers-return').checked = Boolean(ride.offers_return);

    document.getElementById('input-car-seats-outward').value = ride.seats_outward !== undefined ? ride.seats_outward : (ride.seats_total || 2);
    document.getElementById('input-car-seats-return').value = ride.seats_return !== undefined ? ride.seats_return : (ride.seats_total || 1);
    document.getElementById('check-car-direct').checked = Boolean(ride.is_direct);

    openModal('modal-add-car');
  }

  // RENDU DU VÉHICULE : LE CONDUCTEUR EST AFFICHÉ AUTOMATIQUEMENT
  function createRideCardElement(ride, isLocked) {
    const card = document.createElement('div');
    card.className = 'bg-white rounded-2xl p-4 shadow-sm border-2 border-slate-300 space-y-3';

    const myName = safeLower(AppState.currentUser);
    const isDriver = myName && safeLower(ride.driver_name) === myName;
    const canDelete = isDriver || Boolean(AppState.adminToken);

    const outwardPass = Array.isArray(ride.outward_passengers) ? ride.outward_passengers : [];
    const returnPass = Array.isArray(ride.return_passengers) ? ride.return_passengers : [];

    const seatsOut = ride.seats_outward !== undefined ? ride.seats_outward : (ride.seats_total || 0);
    const seatsRet = ride.seats_return !== undefined ? ride.seats_return : (ride.seats_total || 0);

    const isDirectAlone = ride.is_direct && seatsOut === 0 && seatsRet === 0;

    const isDirectBadge = ride.is_direct 
      ? `<span class="bg-indigo-100 text-indigo-900 border border-indigo-300 text-[10px] font-black px-2 py-0.5 rounded">${isDirectAlone ? 'Direct par ses moyens 📍' : 'Direct 📍'}</span>` 
      : '';

    card.innerHTML = `
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl ${isDirectAlone ? 'bg-indigo-100 text-indigo-700' : 'bg-blue-100 text-blue-700'} flex items-center justify-center font-bold text-lg">
            ${isDirectAlone ? '🚶' : '🚗'}
          </div>
          <div>
            <h3 class="font-black text-slate-900 text-sm">${escapeHtml(ride.driver_name)}</h3>
            <p class="text-[11px] text-slate-600 font-bold">
              ${isDirectAlone ? 'Véhicule personnel' : `Places passagers : ${seatsOut} Aller • ${seatsRet} Retour`}
            </p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          ${isDirectBadge}
          ${canDelete && !isLocked ? `
            <button class="btn-delete-ride p-1.5 text-slate-400 hover:text-rose-600 rounded-lg hover:bg-rose-50" title="Supprimer">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
            </button>` : ''}
        </div>
      </div>

      <!-- Segment ALLER -->
      ${!isDirectAlone && ride.offers_outward ? `
        <div class="p-2.5 bg-blue-50/80 rounded-xl border border-blue-200 text-xs space-y-1.5">
          <div class="flex justify-between items-center font-black text-xs">
            <span class="text-blue-900">➡️ Aller</span>
            <span class="${outwardPass.length >= seatsOut ? 'text-rose-700 bg-rose-100 px-1.5 py-0.5 rounded' : 'text-blue-700 font-black'}">${outwardPass.length} / ${seatsOut} passager(s)</span>
          </div>
          <div class="flex flex-wrap gap-1.5 outward-chips">
            <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-xs font-black bg-blue-600 text-white shadow-sm">
              🚗 ${escapeHtml(ride.driver_name)} (Conducteur)
            </span>
          </div>
          ${!isLocked ? `<div class="pt-1 outward-action"></div>` : ''}
        </div>
      ` : ''}

      <!-- Segment RETOUR -->
      ${!isDirectAlone && ride.offers_return ? `
        <div class="p-2.5 bg-indigo-50/80 rounded-xl border border-indigo-200 text-xs space-y-1.5">
          <div class="flex justify-between items-center font-black text-xs">
            <span class="text-indigo-900">⬅️ Retour</span>
            <span class="${returnPass.length >= seatsRet ? 'text-rose-700 bg-rose-100 px-1.5 py-0.5 rounded' : 'text-indigo-700 font-black'}">${returnPass.length} / ${seatsRet} passager(s)</span>
          </div>
          <div class="flex flex-wrap gap-1.5 return-chips">
            <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-xs font-black bg-indigo-600 text-white shadow-sm">
              🚗 ${escapeHtml(ride.driver_name)} (Conducteur)
            </span>
          </div>
          ${!isLocked ? `<div class="pt-1 return-action"></div>` : ''}
        </div>
      ` : ''}
    `;

    const deleteBtn = card.querySelector('.btn-delete-ride');
    if (deleteBtn) {
      deleteBtn.onclick = () => handleDeleteVehicle(ride.id);
    }

    if (!isDirectAlone && ride.offers_outward) {
      const chipsContainer = card.querySelector('.outward-chips');
      outwardPass.forEach(pName => {
        chipsContainer.appendChild(createPassengerChip(ride.id, pName, 'outward', isLocked));
      });

      const actionContainer = card.querySelector('.outward-action');
      if (actionContainer) {
        const isUserIn = myName && outwardPass.map(n => safeLower(n)).includes(myName);
        const isDriverHimself = myName && safeLower(ride.driver_name) === myName;
        if (!isUserIn && !isDriverHimself && outwardPass.length < seatsOut) {
          const joinBtn = document.createElement('button');
          joinBtn.className = 'btn-tap w-full py-2 bg-blue-600 hover:bg-blue-700 text-white font-black rounded-lg text-xs shadow-sm';
          joinBtn.textContent = '+ Monter à l\'Aller';
          joinBtn.onclick = () => handleJoinRide(ride.id, 'outward');
          actionContainer.appendChild(joinBtn);
        }
      }
    }

    if (!isDirectAlone && ride.offers_return) {
      const chipsContainer = card.querySelector('.return-chips');
      returnPass.forEach(pName => {
        chipsContainer.appendChild(createPassengerChip(ride.id, pName, 'return', isLocked));
      });

      const actionContainer = card.querySelector('.return-action');
      if (actionContainer) {
        const isUserIn = myName && returnPass.map(n => safeLower(n)).includes(myName);
        const isDriverHimself = myName && safeLower(ride.driver_name) === myName;
        if (!isUserIn && !isDriverHimself && returnPass.length < seatsRet) {
          const joinBtn = document.createElement('button');
          joinBtn.className = 'btn-tap w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-lg text-xs shadow-sm';
          joinBtn.textContent = '+ Monter au Retour';
          joinBtn.onclick = () => handleJoinRide(ride.id, 'return');
          actionContainer.appendChild(joinBtn);
        }
      }
    }

    return card;
  }

  function createPassengerChip(rideId, name, direction, isLocked) {
    const chip = document.createElement('span');
    const myName = safeLower(AppState.currentUser);
    const isMe = myName && safeLower(name) === myName;
    const canRemove = (isMe || Boolean(AppState.adminToken)) && !isLocked;

    chip.className = `inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-black shadow-sm ${isMe ? 'bg-blue-600 text-white' : 'bg-white border-2 border-slate-300 text-slate-800'}`;
    chip.innerHTML = `
      <span>👤 ${escapeHtml(name)}</span>
      ${canRemove ? `<button class="btn-remove-pass opacity-75 hover:opacity-100 font-black ml-0.5">&times;</button>` : ''}
    `;

    if (canRemove) {
      chip.querySelector('.btn-remove-pass').onclick = () => handleLeaveRide(rideId, name, direction);
    }
    return chip;
  }

  async function handleJoinRide(rideId, direction) {
    if (!AppState.currentUser) {
      checkUserIdentityFlow();
      return;
    }

    try {
      await callServer('ctrlJoinRide', AppState.matchId, rideId, AppState.currentUser, direction);
      showToast('Vous avez rejoint le véhicule !', 'success');
      loadMatchDetails();
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  async function handleLeaveRide(rideId, playerName, direction) {
    try {
      await callServer('ctrlLeaveRide', AppState.matchId, rideId, playerName, direction);
      showToast('Passager retiré.', 'info');
      loadMatchDetails();
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  async function handleDeleteVehicle(rideId) {
    if (!confirm('Supprimer votre véhicule ? Les passagers inscrits basculeront automatiquement dans la liste "Besoin d\'une place".')) {
      return;
    }

    try {
      await callServer('ctrlDeleteVehicle', AppState.matchId, rideId, AppState.currentUser, AppState.adminToken);
      showToast('Véhicule supprimé.', 'info');
      loadMatchDetails();
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  async function handleLeaveWaitingList(waitingId) {
    try {
      await callServer('ctrlLeaveWaitingList', AppState.matchId, waitingId, AppState.currentUser, AppState.adminToken);
      showToast('Retiré de la liste d\'attente.', 'info');
      loadMatchDetails();
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  // VUE ADMIN
  async function loadAdminDashboard() {
    if (!AppState.adminToken) return;

    try {
      const matches = await callServer('ctrlGetAdminMatches', AppState.adminToken);
      AppState.adminMatches = Array.isArray(matches) ? matches : [];
      renderAdminMatches(AppState.adminMatches);
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  function renderAdminMatches(matches) {
    const container = document.getElementById('admin-matches-list');
    if (!container) return;
    container.innerHTML = '';

    if (!matches || !Array.isArray(matches) || matches.length === 0) {
      container.innerHTML = `
        <div class="p-6 text-center bg-white rounded-2xl border-2 border-dashed border-slate-300 text-slate-500 font-bold text-xs">
          Aucun match créé pour le moment. Cliquez sur le bouton ci-dessus pour planifier votre premier déplacement.
        </div>`;
      return;
    }

    matches.forEach(m => {
      const card = document.createElement('div');
      card.className = 'bg-white rounded-2xl p-4 shadow-sm border-2 border-slate-200 space-y-3';

      const lockBadge = m.is_locked 
        ? `<span class="px-2.5 py-0.5 rounded text-[10px] font-black bg-rose-100 text-rose-900 border border-rose-300">Verrouillé</span>`
        : `<span class="px-2.5 py-0.5 rounded text-[10px] font-black bg-emerald-100 text-emerald-900 border border-emerald-300">Ouvert</span>`;

      card.innerHTML = `
        <div class="flex items-start justify-between">
          <div>
            <div class="flex items-center gap-1.5">
              ${lockBadge}
              <span class="text-xs text-slate-500 font-bold">${formatShortDate(m.event_date)} à ${formatShortTime(m.departure_time)}</span>
            </div>
            <h3 class="font-black text-slate-900 text-sm mt-0.5">${escapeHtml(m.title)}</h3>
            <p class="text-xs text-slate-500 truncate">📍 ${escapeHtml(m.meeting_place)}</p>
          </div>
        </div>

        <div class="grid grid-cols-3 gap-2 bg-slate-50 p-2 rounded-xl text-center text-xs border border-slate-200">
          <div>
            <span class="text-slate-400 block text-[10px] uppercase font-bold">Voitures</span>
            <span class="font-black text-slate-900">${m.rides_count || 0}</span>
          </div>
          <div>
            <span class="text-slate-400 block text-[10px] uppercase font-bold">Places A/R</span>
            <span class="font-black text-slate-900">${m.total_seats_outward || 0} / ${m.total_seats_return || 0}</span>
          </div>
          <div>
            <span class="text-slate-400 block text-[10px] uppercase font-bold">Sans place</span>
            <span class="font-black ${m.waiting_count > 0 ? 'text-amber-600' : 'text-slate-900'}">${m.waiting_count || 0}</span>
          </div>
        </div>

        <div class="grid grid-cols-5 gap-1.5 pt-1">
          <button class="btn-match-copy-link btn-tap py-2.5 bg-indigo-50 text-indigo-800 hover:bg-indigo-100 font-black rounded-xl text-xs flex items-center justify-center gap-1 border border-indigo-200" title="Copier le lien Joueur">
            <span>🔗</span>
          </button>
          <button class="btn-match-view btn-tap py-2.5 bg-blue-50 text-blue-800 hover:bg-blue-100 font-black rounded-xl text-xs flex items-center justify-center gap-1 border border-blue-200" title="Voir comme Joueur">
            <span>👁️</span>
          </button>
          <button class="btn-match-lock btn-tap py-2.5 bg-slate-100 text-slate-800 hover:bg-slate-200 font-black rounded-xl text-xs flex items-center justify-center gap-1 border border-slate-300" title="${m.is_locked ? 'Déverrouiller' : 'Verrouiller'}">
            <span>${m.is_locked ? '🔓' : '🔒'}</span>
          </button>
          <button class="btn-match-share btn-tap py-2.5 bg-emerald-50 text-emerald-800 hover:bg-emerald-100 font-black rounded-xl text-xs flex items-center justify-center gap-1 border border-emerald-300" title="Synthèse WhatsApp">
            <span>💬</span>
          </button>
          <button class="btn-match-delete btn-tap py-2.5 bg-rose-50 text-rose-800 hover:bg-rose-100 font-black rounded-xl text-xs flex items-center justify-center gap-1 border border-rose-300" title="Supprimer">
            <span>🗑️</span>
          </button>
        </div>
      `;

      card.querySelector('.btn-match-copy-link').onclick = () => {
        const playerUrl = buildAppUrl({ m: m.id });
        navigator.clipboard.writeText(playerUrl).then(() => {
          showToast('Lien joueur copié !', 'success');
        }).catch(() => {
          prompt('Copiez ce lien :', playerUrl);
        });
      };

      card.querySelector('.btn-match-view').onclick = () => {
        window.open(buildAppUrl({ m: m.id }), '_blank');
      };

      card.querySelector('.btn-match-lock').onclick = async () => {
        try {
          await callServer('ctrlToggleMatchLock', AppState.adminToken, m.id, !m.is_locked);
          showToast(m.is_locked ? 'Match déverrouillé' : 'Match verrouillé', 'success');
          loadAdminDashboard();
        } catch (err) {
          showToast(err.message, 'error');
        }
      };

      card.querySelector('.btn-match-share').onclick = async () => {
        try {
          const summary = await callServer('ctrlGetWhatsAppSummary', AppState.adminToken, m.id, AppState.webAppUrl, AppState.authUser);
          document.getElementById('textarea-whatsapp').value = summary;
          openModal('modal-whatsapp');
        } catch (err) {
          showToast(err.message, 'error');
        }
      };

      card.querySelector('.btn-match-delete').onclick = async () => {
        if (!confirm(`Supprimer définitivement "${m.title}" et toutes ses inscriptions ?`)) return;
        try {
          await callServer('ctrlDeleteMatch', AppState.adminToken, m.id);
          showToast('Match supprimé.', 'info');
          loadAdminDashboard();
        } catch (err) {
          showToast(err.message, 'error');
        }
      };

      container.appendChild(card);
    });
  }

  // DÉMARRAGE
  document.addEventListener('DOMContentLoaded', () => {
    updateUserDisplay();

    const loader = document.getElementById('view-loading');
    if (loader) loader.classList.add('hidden');

    // Affichage du diagnostic d'erreur d'initialisation serveur (si présent)
    if (window.SERVER_ROUTING && window.SERVER_ROUTING.initError) {
      const errBox = document.getElementById('view-init-error');
      const errMsg = document.getElementById('init-error-message');
      if (errBox && errMsg) {
        errMsg.textContent = window.SERVER_ROUTING.initError;
        errBox.classList.remove('hidden');
      }
    }

    if (AppState.route === 'ADMIN') {
      document.getElementById('view-admin').classList.remove('hidden');
      loadAdminDashboard();
    } else if (AppState.route === 'MATCH') {
      document.getElementById('view-match').classList.remove('hidden');
      loadMatchDetails();
      checkUserIdentityFlow();
    } else {
      document.getElementById('view-no-access').classList.remove('hidden');
    }

    // CLIC SUR L'EN-TÊTE DE LA SYNTHÈSE POUR OUVRIR LA MODALE DÉTAILS
    const btnOpenSummaryDetails = document.getElementById('btn-open-summary-details');
    if (btnOpenSummaryDetails) {
      btnOpenSummaryDetails.onclick = openSummaryDetailsModal;
    }

    const backdropSummary = document.getElementById('backdrop-summary-details');
    if (backdropSummary) {
      backdropSummary.onclick = () => closeModal('modal-summary-details');
    }

    const btnIdentityConfirm = document.getElementById('btn-identity-confirm');
    if (btnIdentityConfirm) {
      btnIdentityConfirm.onclick = () => {
        closeModal('modal-identity');
        loadMatchDetails();
      };
    }

    const btnIdentityChange = document.getElementById('btn-identity-change');
    if (btnIdentityChange) {
      btnIdentityChange.onclick = () => {
        document.getElementById('identity-known-block').classList.add('hidden');
        document.getElementById('identity-unknown-block').classList.remove('hidden');
      };
    }

    const formIdentity = document.getElementById('form-identity');
    if (formIdentity) {
      formIdentity.onsubmit = (e) => {
        e.preventDefault();
        const inputName = document.getElementById('input-identity-name').value.trim();
        if (inputName) {
          setUsername(inputName);
          closeModal('modal-identity');
          showToast(`Bienvenue, ${inputName} !`, 'success');
          loadMatchDetails();
        }
      };
    }

    document.querySelectorAll('.btn-close-modal').forEach(btn => {
      btn.onclick = () => {
        closeModal('modal-create-match');
        closeModal('modal-whatsapp');
        closeModal('modal-add-car');
        closeModal('modal-waiting');
        closeModal('modal-summary-details');
      };
    });

    const btnAdminRefresh = document.getElementById('btn-admin-refresh');
    if (btnAdminRefresh) btnAdminRefresh.onclick = loadAdminDashboard;

    const btnPlayerRefresh = document.getElementById('btn-player-refresh');
    if (btnPlayerRefresh) btnPlayerRefresh.onclick = loadMatchDetails;

    const btnChangeUser = document.getElementById('btn-change-username');
    if (btnChangeUser) {
      btnChangeUser.onclick = () => {
        document.getElementById('input-identity-name').value = AppState.currentUser || '';
        document.getElementById('identity-known-block').classList.add('hidden');
        document.getElementById('identity-unknown-block').classList.remove('hidden');
        openModal('modal-identity');
      };
    }

    const btnOpenCreate = document.getElementById('btn-open-create-match');
    if (btnOpenCreate) {
      btnOpenCreate.onclick = () => {
        document.getElementById('form-create-match').reset();
        openModal('modal-create-match');
      };
    }

    const formCreateMatch = document.getElementById('form-create-match');
    if (formCreateMatch) {
      formCreateMatch.onsubmit = async (e) => {
        e.preventDefault();
        const payload = {
          title: document.getElementById('input-match-title').value,
          event_date: document.getElementById('input-match-date').value,
          departure_time: document.getElementById('input-match-time').value,
          meeting_place: document.getElementById('input-match-place').value
        };

        try {
          await callServer('ctrlCreateMatch', AppState.adminToken, payload);
          showToast('Match créé avec succès !', 'success');
          closeModal('modal-create-match');
          loadAdminDashboard();
        } catch (err) {
          showToast(err.message, 'error');
        }
      };
    }

    // Proposer Voiture
    const btnOpenAddCar = document.getElementById('btn-open-add-car');
    if (btnOpenAddCar) {
      btnOpenAddCar.onclick = () => {
        if (!AppState.currentUser) {
          checkUserIdentityFlow();
          return;
        }
        document.getElementById('modal-car-title').textContent = 'Proposer un véhicule';
        document.getElementById('input-edit-ride-id').value = '';
        document.getElementById('input-car-driver').value = AppState.currentUser || '';
        document.getElementById('input-car-driver').disabled = false;
        document.getElementById('input-car-seats-outward').value = '2';
        document.getElementById('input-car-seats-return').value = '1';
        document.getElementById('check-car-direct').checked = false;
        openModal('modal-add-car');
      };
    }

    // Direct sur place
    const btnQuickDirect = document.getElementById('btn-quick-direct');
    if (btnQuickDirect) {
      btnQuickDirect.onclick = async () => {
        if (!AppState.currentUser) {
          checkUserIdentityFlow();
          return;
        }

        if (!confirm(`Confirmer que vous allez directement au match par vos propres moyens (sans passer par le covoiturage) ?`)) {
          return;
        }

        const payload = {
          driver_name: AppState.currentUser,
          offers_outward: true,
          offers_return: true,
          seats_outward: 0,
          seats_return: 0,
          is_direct: true
        };

        try {
          await callServer('ctrlRegisterVehicle', AppState.matchId, payload);
          showToast('Enregistré : Direct par vos propres moyens !', 'success');
          loadMatchDetails();
        } catch (err) {
          showToast(err.message, 'error');
        }
      };
    }

    const formAddCar = document.getElementById('form-add-car');
    if (formAddCar) {
      formAddCar.onsubmit = async (e) => {
        e.preventDefault();
        const editId = document.getElementById('input-edit-ride-id').value;
        const driverName = document.getElementById('input-car-driver').value.trim();
        if (!driverName) return;
        setUsername(driverName);

        const payload = {
          driver_name: driverName,
          offers_outward: document.getElementById('check-offers-outward').checked,
          offers_return: document.getElementById('check-offers-return').checked,
          seats_outward: parseInt(document.getElementById('input-car-seats-outward').value, 10) || 0,
          seats_return: parseInt(document.getElementById('input-car-seats-return').value, 10) || 0,
          is_direct: document.getElementById('check-car-direct').checked,
          adminToken: AppState.adminToken
        };

        if (!payload.offers_outward && !payload.offers_return) {
          showToast('Cochez au moins l\'aller ou le retour.', 'error');
          return;
        }

        try {
          if (editId) {
            await callServer('ctrlUpdateVehicle', AppState.matchId, editId, driverName, payload);
            showToast('Véhicule mis à jour !', 'success');
          } else {
            await callServer('ctrlRegisterVehicle', AppState.matchId, payload);
            showToast('Véhicule enregistré !', 'success');
          }
          closeModal('modal-add-car');
          loadMatchDetails();
        } catch (err) {
          showToast(err.message, 'error');
        }
      };
    }

    // Besoin d'une place
    const btnOpenWaiting = document.getElementById('btn-open-waiting-list');
    if (btnOpenWaiting) {
      btnOpenWaiting.onclick = () => {
        if (!AppState.currentUser) {
          checkUserIdentityFlow();
          return;
        }
        document.getElementById('input-waiting-name').value = AppState.currentUser || '';
        openModal('modal-waiting');
      };
    }

    const formWaiting = document.getElementById('form-waiting');
    if (formWaiting) {
      formWaiting.onsubmit = async (e) => {
        e.preventDefault();
        const pName = document.getElementById('input-waiting-name').value.trim();
        if (!pName) return;
        setUsername(pName);

        const needsOut = document.getElementById('check-wait-outward').checked;
        const needsRet = document.getElementById('check-wait-return').checked;

        if (!needsOut && !needsRet) {
          showToast('Sélectionnez au moins un trajet.', 'error');
          return;
        }

        try {
          await callServer('ctrlJoinWaitingList', AppState.matchId, pName, needsOut, needsRet);
          showToast('Inscription en liste d\'attente validée.', 'success');
          closeModal('modal-waiting');
          loadMatchDetails();
        } catch (err) {
          showToast(err.message, 'error');
        }
      };
    }

    // Copie WhatsApp
    const btnCopyWhatsApp = document.getElementById('btn-copy-whatsapp');
    if (btnCopyWhatsApp) {
      btnCopyWhatsApp.onclick = () => {
        const textarea = document.getElementById('textarea-whatsapp');
        textarea.select();
        document.execCommand('copy');
        showToast('Synthèse copiée dans le presse-papier !', 'success');
      };
    }
  });
</script>
